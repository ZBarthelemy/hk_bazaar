[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hk-bazaar"
version = "0.1.0"
description = "Hong Kong classifieds aggregator — asiaXPAT, Carousell, Facebook Marketplace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hk_bazaar" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "loguru>=0.7",
    "lxml>=5.0",
    "playwright>=1.44",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "selectolax>=0.3",
    "sqlalchemy>=2.0",
    "tenacity>=8.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "types-python-dateutil>=2.9",
]

[project.scripts]
hk-bazaar = "hk_bazaar.cli:app"

[tool.hatch.build.targets.sdist]
include = ["src/hk_bazaar", "tests", "README.md"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/hk_bazaar/utils/hk_locations.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hk_bazaar"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["selectolax.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"